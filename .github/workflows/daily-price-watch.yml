name: Daily Price Watch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [price-movement-watch]

permissions:
  contents: write

jobs:
  scrape:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily SERP scrape
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python daily_scrape.py
      - name: Commit SERP history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/serp_history.json
          git diff --cached --quiet || git commit -m 'Daily SERP price movement update'
          git push
