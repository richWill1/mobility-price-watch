<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobility Price Watch</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#152238;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:40px 22px}.hero{background:#132238;color:white;border-radius:22px;padding:34px;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;color:#c8d3e2}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.stat{background:white;border:1px solid #e2e7ef;border-radius:16px;padding:20px}.stat b{display:block;font-size:28px;margin-top:6px}.bar{display:flex;gap:12px;margin:20px 0}.bar input{flex:1;padding:14px 16px;border:1px solid #d9e0ea;border-radius:12px;font-size:15px}.table{background:white;border:1px solid #e2e7ef;border-radius:16px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:17px;border-bottom:1px solid #edf0f5}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#66758a}td{font-size:14px}.price{font-weight:800;font-size:17px}.win{font-weight:700}.gms.win{color:#087443}.mobigo.win{color:#7050b8}.links a{margin-right:8px;color:#3158a8;text-decoration:none;font-size:12px}.muted{color:#718096;font-size:12px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf6f1;color:#087443;font-size:12px;font-weight:700}@media(max-width:700px){.stats{grid-template-columns:1fr}.hero h1{font-size:27px}}</style></head><body><main class="wrap"><section class="hero"><h1>Mobility Price Watch</h1><p>Live price comparison between GMS Mobility and Mobigo.</p></section><section class="stats"><div class="stat">Matched products<b id="matched">—</b></div><div class="stat">GMS cheaper<b id="gmscheaper">—</b></div><div class="stat">Mobigo cheaper<b id="mobigocheaper">—</b></div></section><div class="bar"><input id="search" placeholder="Search products…"></div><section class="table"><table><thead><tr><th>Product</th><th>GMS Mobility</th><th>Mobigo</th><th>Difference</th><th>Cheapest</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading live prices…</td></tr></tbody></table></section><p class="muted" id="updated" style="margin:16px 4px"></p></main><script>let data=[];const money=n=>n==null?'—':new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n);function render(){const q=document.getElementById('search').value.toLowerCase();const rows=data.filter(x=>x.product.toLowerCase().includes(q));document.getElementById('rows').innerHTML=rows.map(x=>{const gc=x.gms.price<x.mobigo.price, d=Math.abs(x.difference);return `<tr><td><strong>${x.product}</strong><div class="links"><a href="${x.gms.url}" target="_blank">GMS ↗</a><a href="${x.mobigo.url}" target="_blank">Mobigo ↗</a></div></td><td class="price ${gc?'gms win':''}">${money(x.gms.price)}</td><td class="price ${!gc?'mobigo win':''}">${money(x.mobigo.price)}</td><td>${money(d)}</td><td><span class="pill">${gc?'GMS Mobility':'Mobigo'}</span></td></tr>`}).join('')||'<tr><td colspan="5">No matching products.</td></tr>'}async function load(){try{const r=await fetch('/api/prices');const j=await r.json();data=j.matches||[];document.getElementById('matched').textContent=data.length;document.getElementById('gmscheaper').textContent=data.filter(x=>x.difference<0).length;document.getElementById('mobigocheaper').textContent=data.filter(x=>x.difference>0).length;document.getElementById('updated').textContent='Last checked: '+new Date(j.updated*1000).toLocaleString('en-GB');render()}catch(e){document.getElementById('rows').innerHTML='<tr><td colspan="5">Unable to load live prices.</td></tr>'}}document.getElementById('search').addEventListener('input',render);load();setInterval(load,900000)</script></body></html>
