<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareCo Price Watch</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fa}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#68758a;font-weight:700}.h1{font-size:34px;font-weight:800;margin:4px 0}.sub{color:#68758a}.actions{display:flex;gap:10px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;background:#172033;color:white}.btn.alt{background:white;color:#172033;border:1px solid #d9dee7}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card{background:white;border:1px solid #e2e6ed;border-radius:12px;padding:16px}.label{font-size:12px;color:#738096}.value{font-size:25px;font-weight:800;margin-top:5px}.toolbar{display:flex;gap:10px;align-items:center;background:white;border:1px solid #e2e6ed;border-radius:12px;padding:12px;margin-bottom:12px}.toolbar input,.toolbar select{padding:10px;border:1px solid #d9dee7;border-radius:8px;background:white}.tablewrap{background:white;border:1px solid #e2e6ed;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:12px 14px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}th{background:#fafbfc;color:#667286;font-size:12px;position:sticky;top:0}a{color:#2357c6;text-decoration:none}.price{font-weight:800}.cheaper{font-weight:800}.cc{color:#1f7a4d}.co{color:#2357c6}.same{color:#667286}.none{color:#9a6b00}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#f0f2f5;font-size:11px}.status{font-size:12px;color:#68758a;margin-left:auto}@media(max-width:800px){.top{display:block}.actions{margin-top:15px}.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">Competitive pricing</div><div class="h1">CareCo Price Watch</div><div class="sub">CareCo is the master catalogue. Complete Care Shop is only used to find an equivalent product.</div></div><div class="actions"><button class="btn" onclick="refresh()">Refresh prices</button><a class="btn alt" href="/api/export.csv">Export CSV</a></div></div><div class="cards"><div class="card"><div class="label">CareCo products</div><div class="value" id="count">—</div></div><div class="card"><div class="label">Complete Care matches</div><div class="value" id="matches">—</div></div><div class="card"><div class="label">Complete Care cheaper</div><div class="value" id="cccheaper">—</div></div><div class="card"><div class="label">CareCo cheaper</div><div class="value" id="cocheaper">—</div></div></div><div class="toolbar"><input id="search" placeholder="Search CareCo products…" oninput="render()"><select id="filter" onchange="render()"><option value="all">All products</option><option value="cc">Complete Care cheaper</option><option value="co">CareCo cheaper</option><option value="same">Same price</option><option value="none">No match</option></select><span class="status" id="status">Loading…</span></div><div class="tablewrap"><table><thead><tr><th>CareCo product</th><th>CareCo</th><th>Complete Care Shop</th><th>Difference</th><th>Cheaper</th><th>Match</th></tr></thead><tbody id="tbody"></tbody></table></div></div><script>let rows=[];async function load(){const r=await fetch('/api/data');const d=await r.json();rows=d.rows||[];document.getElementById('count').textContent=d.count||0;document.getElementById('matches').textContent=rows.filter(x=>x.complete).length;document.getElementById('cccheaper').textContent=rows.filter(x=>x.cheaper==='Complete Care Shop').length;document.getElementById('cocheaper').textContent=rows.filter(x=>x.cheaper==='CareCo').length;document.getElementById('status').textContent=d.running?`${d.stage} ${d.progress}/${d.total}`:(d.updated?`Updated ${new Date(d.updated*1000).toLocaleString()}`:'Not refreshed yet');render();if(d.running)setTimeout(load,1500)}function refresh(){fetch('/api/refresh',{method:'POST'}).then(load)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;let x=rows.filter(r=>{const t=r.careco.title.toLowerCase();if(q&&!t.includes(q))return false;if(f==='cc'&&r.cheaper!=='Complete Care Shop')return false;if(f==='co'&&r.cheaper!=='CareCo')return false;if(f==='same'&&r.cheaper!=='Same price')return false;if(f==='none'&&r.complete)return false;return true}).slice(0,1000);document.getElementById('tbody').innerHTML=x.map(r=>{const c=r.careco,m=r.complete,d=r.difference;let cls=r.cheaper==='Complete Care Shop'?'cc':r.cheaper==='CareCo'?'co':r.cheaper==='Same price'?'same':'none';return `<tr><td><a href="${esc(c.url)}" target="_blank">${esc(c.title)}</a><div class="badge">${esc(c.sku||'No SKU')}</div></td><td class="price">£${Number(c.price).toFixed(2)}</td><td>${m?`<a href="${esc(m.url)}" target="_blank">${esc(m.title)}</a><div class="price">£${Number(m.price).toFixed(2)}</div>`:'—'}</td><td>${d===null?'—':(d>0?'+':'')+'£'+Number(d).toFixed(2)}</td><td class="cheaper ${cls}">${esc(r.cheaper)}</td><td>${esc(r.match_status)}${r.match_score?` · ${Math.round(r.match_score*100)}%`:''}</td></tr>`}).join('')}load();</script></body></html>
