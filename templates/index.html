<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobility Price Watch</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#152238;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:auto;padding:40px 22px}.hero{background:#132238;color:white;border-radius:22px;padding:34px;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;color:#c8d3e2}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{background:white;border:1px solid #e2e7ef;border-radius:16px;padding:20px}.stat b{display:block;font-size:28px;margin-top:6px}.bar{display:flex;gap:12px;margin:20px 0}.bar input{flex:1;padding:14px 16px;border:1px solid #d9e0ea;border-radius:12px;font-size:15px}.status{margin:0 0 14px;color:#66758a;font-size:13px}.table{background:white;border:1px solid #e2e7ef;border-radius:16px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}th,td{text-align:left;padding:15px;border-bottom:1px solid #edf0f5}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#66758a}td{font-size:14px}.price{font-weight:800;font-size:17px}.win{font-weight:700}.gms.win{color:#087443}.mobigo.win{color:#7050b8}.giant.win{color:#b05a00}.links a{margin-right:8px;color:#3158a8;text-decoration:none;font-size:12px}.muted{color:#718096;font-size:12px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf6f1;color:#087443;font-size:12px;font-weight:700}.condition{display:block;margin-top:5px;font-size:12px;color:#66758a}.condition strong{color:#344054}.refresh{color:#8a5a00}.notfound{color:#98a2b3}@media(max-width:700px){.stats{grid-template-columns:1fr}.hero h1{font-size:27px}}</style></head><body><main class="wrap"><section class="hero"><h1>Mobility Price Watch</h1><p>Live price comparison between GMS Mobility, Mobigo and Mobility Giant.</p></section><section class="stats"><div class="stat">Matched products<b id="matched">—</b></div><div class="stat">GMS cheapest<b id="gmscheaper">—</b></div><div class="stat">Mobigo cheapest<b id="mobigocheaper">—</b></div><div class="stat">Mobility Giant cheapest<b id="giantcheaper">—</b></div></section><div class="bar"><input id="search" placeholder="Search products…"></div><div class="status" id="status">Loading catalogue…</div><section class="table"><table><thead><tr><th>Product</th><th>GMS Mobility</th><th>Condition</th><th>Mobigo</th><th>Condition</th><th>Mobility Giant</th><th>Condition</th><th>Price range</th><th>Cheapest</th></tr></thead><tbody id="rows"><tr><td colspan="9">Loading live prices…</td></tr></tbody></table></section><p class="muted" id="updated" style="margin:16px 4px"></p></main><script>let data=[];const money=n=>n==null?'—':new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n);function cell(p,cls){if(!p)return '<td class="notfound">No match</td><td class="notfound">—</td>';return `<td class="price ${cls||''}">${money(p.price)}</td><td><span class="condition"><strong>${p.condition||'Unknown'}</strong></span><div class="links"><a href="${p.url}" target="_blank">View ↗</a></div></td>`}function render(){const q=document.getElementById('search').value.toLowerCase();const rows=data.filter(x=>x.product.toLowerCase().includes(q));document.getElementById('rows').innerHTML=rows.map(x=>{const ps=[x.gms,x.mobigo,x.mobility_giant].filter(Boolean);const low=Math.min(...ps.map(p=>p.price));const high=Math.max(...ps.map(p=>p.price));const winner=ps.find(p=>p.price===low);return `<tr><td><strong>${x.product}</strong></td>${cell(x.gms,x.gms&&x.gms.price===low?'gms win':'')}${cell(x.mobigo,x.mobigo&&x.mobigo.price===low?'mobigo win':'')}${cell(x.mobility_giant,x.mobility_giant&&x.mobility_giant.price===low?'giant win':'')}<td>${money(high-low)}</td><td><span class="pill">${winner?winner.retailer:'—'}</span></td></tr>`}).join('')||'<tr><td colspan="9">No matching products.</td></tr>'}async function load(){try{const r=await fetch('/api/prices?ts='+Date.now(),{cache:'no-store'});const j=await r.json();data=j.matches||[];document.getElementById('matched').textContent=j.refreshing?'…':data.length;document.getElementById('gmscheaper').textContent=data.filter(x=>x.gms&&(!x.mobigo||x.gms.price< x.mobigo.price)&&(!x.mobility_giant||x.gms.price<x.mobility_giant.price)).length;document.getElementById('mobigocheaper').textContent=data.filter(x=>x.mobigo&&(!x.gms||x.mobigo.price<x.gms.price)&&(!x.mobility_giant||x.mobigo.price<x.mobility_giant.price)).length;document.getElementById('giantcheaper').textContent=data.filter(x=>x.mobility_giant&&(!x.gms||x.mobility_giant.price<x.gms.price)&&(!x.mobigo||x.mobility_giant.price<x.mobigo.price)).length;if(j.refreshing){document.getElementById('status').innerHTML='<span class="refresh">Updating the catalogue — matches will appear automatically.</span>';if(!data.length)document.getElementById('rows').innerHTML='<tr><td colspan="9">Refreshing live products…</td></tr>'}else{document.getElementById('status').textContent=j.error?'Update error: '+j.error:'Catalogue loaded';render()}document.getElementById('updated').textContent=j.updated?'Last checked: '+new Date(j.updated*1000).toLocaleString('en-GB'):''}catch(e){document.getElementById('status').textContent='Unable to load live prices.';document.getElementById('rows').innerHTML='<tr><td colspan="9">Unable to load live prices.</td></tr>'}}document.getElementById('search').addEventListener('input',render);load();setInterval(load,15000)</script></body></html>
